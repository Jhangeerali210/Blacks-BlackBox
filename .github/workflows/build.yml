name: Build Blacks-BlackBox All-In-One Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK 29
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13846066"

      - name: Inject IMEI Spoofing + Network WebView Fix + Speed Optimization
        run: |
          python3 -c "
          # 1. WebView ERR_CACHE_MISS Patch
          iam_path = 'Bcore/src/main/java/top/niunaijun/blackbox/fake/service/IActivityManagerProxy.java'
          with open(iam_path, 'r', encoding='utf-8') as f:
              code = f.read()

          target = 'if (permission.equals(Manifest.permission.ACCOUNT_MANAGER)'
          replacement = '''if (isNetworkPermission(permission)) {
                          return PackageManager.PERMISSION_GRANTED;
                      }
                      if (permission.equals(Manifest.permission.ACCOUNT_MANAGER)'''
          if target in code:
              code = code.replace(target, replacement, 1)

          check_device_target = '@ProxyMethod(\"checkPermission\")'
          check_device_code = '''@ProxyMethod(\"checkPermissionForDevice\")
              public static class checkPermissionForDevice extends MethodHook {
                  @Override
                  protected Object hook(Object who, Method method, Object[] args) throws Throwable {
                      String permission = (String) args[0];
                      if (isNetworkPermission(permission) || isAudioPermission(permission) || isStorageOrMediaPermission(permission)) {
                          return PackageManager.PERMISSION_GRANTED;
                      }
                      return method.invoke(who, args);
                  }
              }

              private static boolean isNetworkPermission(String permission) {
                  if (permission == null) return false;
                  return permission.equals(Manifest.permission.INTERNET)
                          || permission.equals(Manifest.permission.ACCESS_NETWORK_STATE)
                          || permission.equals(Manifest.permission.ACCESS_WIFI_STATE)
                          || permission.equals(Manifest.permission.CHANGE_NETWORK_STATE)
                          || permission.equals(Manifest.permission.CHANGE_WIFI_STATE)
                          || permission.equals(\"android.permission.CHANGE_WIFI_MULTICAST_STATE\");
              }

              @ProxyMethod(\"checkPermission\")'''

          if check_device_target in code:
              code = code.replace(check_device_target, check_device_code, 1)

          with open(iam_path, 'w', encoding='utf-8') as f:
              f.write(code)

          ipm_path = 'Bcore/src/main/java/top/niunaijun/blackbox/fake/service/IPermissionManagerProxy.java'
          with open(ipm_path, 'r', encoding='utf-8') as f:
              ipm_code = f.read()

          ipm_target = 'addMethodHook(new PkgMethodProxy(\"shouldShowRequestPermissionRationale\"));'
          ipm_replacement = '''addMethodHook(new PkgMethodProxy(\"shouldShowRequestPermissionRationale\"));
                  addMethodHook(new ValueMethodProxy(\"checkPermission\", PackageManager.PERMISSION_GRANTED));
                  addMethodHook(new ValueMethodProxy(\"checkUidPermission\", PackageManager.PERMISSION_GRANTED));'''
          if ipm_target in ipm_code:
              ipm_code = ipm_code.replace(ipm_target, ipm_replacement, 1)

          with open(ipm_path, 'w', encoding='utf-8') as f:
              f.write(ipm_code)

          # 2. DeviceSpoofProfile IMEI Field
          dsp_path = 'Bcore/src/main/java/top/niunaijun/blackbox/fake/device/DeviceSpoofProfile.java'
          with open(dsp_path, 'r', encoding='utf-8') as f:
              dsp = f.read()
          dsp = dsp.replace('public final String androidId;', 'public final String androidId;\n    public String imei = \"358249110294812\";')
          with open(dsp_path, 'w', encoding='utf-8') as f:
              f.write(dsp)

          # 3. DeviceSpoofManager IMEI Persistence & Preset
          dsm_path = 'Bcore/src/main/java/top/niunaijun/blackbox/fake/device/DeviceSpoofManager.java'
          with open(dsm_path, 'r', encoding='utf-8') as f:
              dsm = f.read()
          dsm = dsm.replace('private static final String KEY_ANDROID_ID = \"android_id_\";', 'private static final String KEY_IMEI = \"imei_\";\n    private static final String KEY_ANDROID_ID = \"android_id_\";')

          target_getProfile = 'return new DeviceSpoofProfile(\n                valueOrDefault(prefs.getString(KEY_MANUFACTURER + userId, null), defaults.manufacturer),'
          repl_getProfile = '''DeviceSpoofProfile profile = new DeviceSpoofProfile(
                          valueOrDefault(prefs.getString(KEY_MANUFACTURER + userId, null), defaults.manufacturer),'''
          dsm = dsm.replace(target_getProfile, repl_getProfile)

          target_end_profile = 'valueOrDefault(prefs.getString(KEY_ANDROID_ID + userId, null), defaults.androidId)\n        );'
          repl_end_profile = '''valueOrDefault(prefs.getString(KEY_ANDROID_ID + userId, null), defaults.androidId)
                  );
                  profile.imei = prefs.getString(KEY_IMEI + userId, \"3582491102948\" + String.format(Locale.US, \"%02d\", Math.abs(userId % 100)));
                  return profile;'''
          dsm = dsm.replace(target_end_profile, repl_end_profile)

          dsm = dsm.replace('return new DeviceSpoofProfile(\n                \"Samsung\",', 'DeviceSpoofProfile profile = new DeviceSpoofProfile(\n                \"Samsung\",')
          target_samsung = 'stableAndroidId(\"bbb_samsung_\" + userId)\n        );'
          repl_samsung = '''stableAndroidId(\"bbb_samsung_\" + userId)
                  );
                  profile.imei = \"358249110294812\";
                  return profile;'''
          dsm = dsm.replace(target_samsung, repl_samsung)

          target_save = 'public static void saveUserProfile(int userId, String manufacturer, String model, String androidId) {'
          repl_save = '''public static void saveUserProfile(int userId, String manufacturer, String model, String androidId, String imei) {
                  DeviceSpoofProfile profile = buildCustomProfile(userId, manufacturer, model, androidId);
                  prefs().edit()
                          .putString(KEY_MANUFACTURER + userId, profile.manufacturer)
                          .putString(KEY_BRAND + userId, profile.brand)
                          .putString(KEY_MODEL + userId, profile.model)
                          .putString(KEY_DEVICE + userId, profile.device)
                          .putString(KEY_PRODUCT + userId, profile.product)
                          .putString(KEY_FINGERPRINT + userId, profile.fingerprint)
                          .putString(KEY_SERIAL + userId, profile.serial)
                          .putString(KEY_ANDROID_ID + userId, profile.androidId)
                          .putString(KEY_IMEI + userId, imei)
                          .commit();
              }

              public static void saveUserProfile(int userId, String manufacturer, String model, String androidId) {
                  saveUserProfile(userId, manufacturer, model, androidId, \"3582491102948\" + String.format(Locale.US, \"%02d\", Math.abs(userId % 100)));
              }

              private static void unusedSaveUserProfile('''
          dsm = dsm.replace(target_save, repl_save)
          with open(dsm_path, 'w', encoding='utf-8') as f:
              f.write(dsm)

          # 4. ITelephonyManagerProxy Hook
          itm_path = 'Bcore/src/main/java/top/niunaijun/blackbox/fake/service/ITelephonyManagerProxy.java'
          with open(itm_path, 'r', encoding='utf-8') as f:
              itm = f.read()
          t_imei = '''@ProxyMethod(\"getImeiForSlot\")
              public static class getImeiForSlot extends MethodHook {
                  @Override
                  protected Object hook(Object who, Method method, Object[] args) throws Throwable {
                      int userId = top.niunaijun.blackbox.app.BActivityThread.getUserId();
                      top.niunaijun.blackbox.fake.device.DeviceSpoofProfile profile = top.niunaijun.blackbox.fake.device.DeviceSpoofManager.getProfile(userId);
                      if (profile != null && !android.text.TextUtils.isEmpty(profile.imei)) {
                          return profile.imei;
                      }
                      return Md5Utils.md5(BlackBoxCore.getHostPkg());
                  }
              }

              @ProxyMethod(\"getDeviceId\")
              public static class GetDeviceId extends MethodHook {
                  @Override
                  protected Object hook(Object who, Method method, Object[] args) throws Throwable {
                      int userId = top.niunaijun.blackbox.app.BActivityThread.getUserId();
                      top.niunaijun.blackbox.fake.device.DeviceSpoofProfile profile = top.niunaijun.blackbox.fake.device.DeviceSpoofManager.getProfile(userId);
                      if (profile != null && !android.text.TextUtils.isEmpty(profile.imei)) {
                          return profile.imei;
                      }
                      return Md5Utils.md5(BlackBoxCore.getHostPkg());
                  }
              }'''
          idx1 = itm.find('@ProxyMethod(\"getDeviceId\")')
          idx2 = itm.find('@ProxyMethod(\"getMeidForSlot\")')
          if idx1 != -1 and idx2 != -1:
              itm = itm[:idx1] + t_imei + '\n\n    ' + itm[idx2:]
          with open(itm_path, 'w', encoding='utf-8') as f:
              f.write(itm)

          # 5. activity_device_spoofing.xml
          xml_path = 'app/src/main/res/layout/activity_device_spoofing.xml'
          with open(xml_path, 'r', encoding='utf-8') as f:
              xml = f.read()
          imei_field = '''<com.google.android.material.textfield.TextInputLayout
                              android:layout_width=\"match_parent\"
                              android:layout_height=\"wrap_content\"
                              android:layout_marginTop=\"14dp\"
                              android:hint=\"IMEI (15 digits)\">

                          <com.google.android.material.textfield.TextInputEditText
                                  android:id=\"@+id/device_imei_edit\"
                                  android:layout_width=\"match_parent\"
                                  android:layout_height=\"wrap_content\"
                                  android:fontFamily=\"monospace\"
                                  android:inputType=\"number\"
                                  android:maxLength=\"15\" />
                      </com.google.android.material.textfield.TextInputLayout>

                      <com.google.android.material.textfield.TextInputLayout
                              android:layout_width=\"match_parent\"
                              android:layout_height=\"wrap_content\"
                              android:layout_marginTop=\"14dp\"
                              android:hint=\"@string/device_spoofing_android_id\">'''
          xml = xml.replace('<com.google.android.material.textfield.TextInputLayout\n                    android:layout_width=\"match_parent\"\n                    android:layout_height=\"wrap_content\"\n                    android:layout_marginTop=\"14dp\"\n                    android:hint=\"@string/device_spoofing_android_id\">', imei_field)
          with open(xml_path, 'w', encoding='utf-8') as f:
              f.write(xml)

          # 6. DeviceSpoofingActivity.kt
          kt_path = 'app/src/main/java/com/onebitmonochrome/blacksbbox/view/spoof/DeviceSpoofingActivity.kt'
          with open(kt_path, 'r', encoding='utf-8') as f:
              kt = f.read()
          kt = kt.replace('val androidId = viewBinding.androidIdEdit.text?.toString().orEmpty().trim()',
                          'val androidId = viewBinding.androidIdEdit.text?.toString().orEmpty().trim()\n            val imei = viewBinding.deviceImeiEdit.text?.toString().orEmpty().trim()')
          kt = kt.replace('DeviceSpoofManager.saveUserProfile(currentUserID(), manufacturer, model, androidId)',
                          'DeviceSpoofManager.saveUserProfile(currentUserID(), manufacturer, model, androidId, imei)')
          kt = kt.replace('viewBinding.androidIdEdit.setText(profile.androidId)',
                          'viewBinding.androidIdEdit.setText(profile.androidId)\n        viewBinding.deviceImeiEdit.setText(profile.imei)')
          with open(kt_path, 'w', encoding='utf-8') as f:
              f.write(kt)

          print('All patches injected 100% cleanly!')
          "

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blacks-BlackBox-Pro-AllInOne
          path: app/build/outputs/apk/debug/*.apk
